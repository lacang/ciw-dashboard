define({id: "d95db0c1", inputs: ["prev","cur","display","html"], body: (prev,cur,display,html) => {
{

  else {
    const prevTitles = new Set(prev.top.map(t => t.title));

    const inflow = cur.top.filter(t => !prevTitles.has(t.title));

    display(html`<div class="card" style="border-left-color:var(--ok)">
      <div class="why" style="margin-top:0"><b>新进榜</b>：${inflow.length ? inflow.map(t => t.title).join("、") : "无（头部很稳）"}</div>
      <div class="why"><b>掉出榜</b>：${outflow.length ? outflow.map(t => t.title).join("、") : "无"}</div>
    </div>`);
  }
}
}});

}});
